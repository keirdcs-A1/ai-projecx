# Example only. This file is inert here.
# Copy into the repository's .github/workflows directory to activate it.
name: Rebuild Iran monitor snapshot
on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: static-pages
  cancel-in-progress: false
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check parser
        run: python3 portfolio-apps/iran-monitor/scripts/test_snapshot.py
      - name: Retrieve fixed feeds and build snapshot
        run: python3 portfolio-apps/iran-monitor/scripts/build_snapshot.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: portfolio-apps
      - uses: actions/deploy-pages@v4
